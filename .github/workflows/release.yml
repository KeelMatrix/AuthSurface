name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact reviewed recovery workflow commit
        required: true
        type: string
      archive_sha256:
        description: Exact preserved symbol archive SHA256
        required: true
        type: string
      package_id:
        description: Package ID from the recovery contract
        required: true
        type: string
      package_version:
        description: Original published version
        required: true
        type: string
      source_commit:
        description: Immutable original shipping source commit
        required: true
        type: string
      source_tag:
        description: Immutable original shipping tag
        required: true
        type: string
      service_index:
        description: Approved modern NuGet service index
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      KEELMATRIX_NO_TELEMETRY: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DO_NOT_TRACK: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release-version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
            throw "Malformed release tag '$tag'. Expected vX.Y.Z."
          }
          "version=$($Matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.x

      - name: Validate changelog and version contract
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: pwsh -NoProfile -File .\scripts\check-release-contract.ps1 -Mode Release -Version $env:RELEASE_VERSION -Tag '${{ github.ref_name }}'

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\KeelMatrix.AuthSurface.sln --configfile .\NuGet.config --no-cache --force
          if ($LASTEXITCODE -ne 0) { throw "Restore failed with exit code $LASTEXITCODE." }

      - name: Build
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          dotnet build .\KeelMatrix.AuthSurface.sln --configuration Release --no-restore -p:Version=$env:RELEASE_VERSION -p:PackageVersion=$env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Build failed with exit code $LASTEXITCODE." }

      - name: Test
        shell: pwsh
        run: |
          dotnet test .\KeelMatrix.AuthSurface.sln --configuration Release --no-build --no-restore --logger 'console;verbosity=minimal'
          if ($LASTEXITCODE -ne 0) { throw "Test failed with exit code $LASTEXITCODE." }

      - name: Pack
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts/packages'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Get-ChildItem -LiteralPath $output -File -ErrorAction SilentlyContinue | Remove-Item -Force
          dotnet pack .\src\KeelMatrix.AuthSurface\KeelMatrix.AuthSurface.csproj --configuration Release --no-build --no-restore --include-symbols --p:SymbolPackageFormat=snupkg -p:Version=$env:RELEASE_VERSION -p:PackageVersion=$env:RELEASE_VERSION --output $output
          if ($LASTEXITCODE -ne 0) { throw "Pack failed with exit code $LASTEXITCODE." }

      - name: Validate exact package set and contents
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts/packages'
          $expected = @(
            "KeelMatrix.AuthSurface.${env:RELEASE_VERSION}.nupkg",
            "KeelMatrix.AuthSurface.${env:RELEASE_VERSION}.snupkg"
          )
          $actual = @(Get-ChildItem -LiteralPath $output -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (@(Compare-Object -ReferenceObject $expected -DifferenceObject $actual).Count -gt 0) {
            throw "Unexpected package artifact set. Expected: $($expected -join ', '); actual: $($actual -join ', ')"
          }
          & .\scripts\inspect-package.ps1 -PackagePath (Join-Path $output $expected[0]) -SymbolPackagePath (Join-Path $output $expected[1]) -ExpectedVersion $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Package inspection failed with exit code $LASTEXITCODE." }
          $hashes = foreach ($name in $expected) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $output $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $hashes | Tee-Object -FilePath (Join-Path $output 'SHA256SUMS')

      - name: Retain inspected release archives
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-${{ steps.release-version.outputs.version }}-${{ github.sha }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 90

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: dmitriyzen

      - name: Push package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          NUGET_PUSH_TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts/packages'
          & .\scripts\push-release-package.ps1 -PackagePath (Join-Path $output "KeelMatrix.AuthSurface.${env:RELEASE_VERSION}.nupkg")
          if ($LASTEXITCODE -ne 0) { throw "Package and symbol publication failed with exit code $LASTEXITCODE." }

  recover-symbols:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: authsurface-symbol-recovery-0.1.0
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      KEELMATRIX_NO_TELEMETRY: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DO_NOT_TRACK: '1'
      RECOVERY_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      RECOVERY_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
      RECOVERY_PACKAGE_ID: ${{ inputs.package_id }}
      RECOVERY_PACKAGE_VERSION: ${{ inputs.package_version }}
      RECOVERY_SOURCE_COMMIT: ${{ inputs.source_commit }}
      RECOVERY_SOURCE_TAG: ${{ inputs.source_tag }}
      RECOVERY_SERVICE_INDEX: ${{ inputs.service_index }}
    steps:
      - name: Check out recovery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Prepare exact symbols recovery
        id: recovery-preflight
        shell: pwsh
        run: |
          & ./scripts/recover-symbols.ps1 -Mode Prepare -OutputDirectory ./artifacts/symbol-recovery
          if ($LASTEXITCODE -ne 0) { throw "Recovery preparation failed with exit code $LASTEXITCODE." }

      - name: Retain verified recovery archive before login
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: symbol-recovery-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/symbol-recovery/
          if-no-files-found: error
          retention-days: 90

      - name: Authenticate symbols recovery to NuGet.org
        id: recovery-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: dmitriyzen

      - name: Submit exact symbols only
        shell: pwsh
        env:
          NUGET_PUSH_TOKEN: ${{ steps.recovery-login.outputs.NUGET_API_KEY }}
        run: |
          & ./scripts/recover-symbols.ps1 -Mode Submit -OutputDirectory ./artifacts/symbol-recovery
          if ($LASTEXITCODE -ne 0) { throw "Symbol recovery failed with exit code $LASTEXITCODE. Preserve effects; do not replay." }

      - name: Retain recovery effect receipt
        if: ${{ always() && steps.recovery-preflight.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: symbol-recovery-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/symbol-recovery/
          if-no-files-found: error
          retention-days: 90
