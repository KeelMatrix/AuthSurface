name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      KEELMATRIX_NO_TELEMETRY: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DO_NOT_TRACK: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate release tag
        id: release-version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
            throw "Malformed release tag '$tag'. Expected vX.Y.Z."
          }
          "version=$($Matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x

      - name: Validate changelog and version contract
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: pwsh -NoProfile -File .\scripts\check-release-contract.ps1 -Mode Release -Version $env:RELEASE_VERSION -Tag '${{ github.ref_name }}'

      - name: Restore
        run: dotnet restore .\KeelMatrix.AuthSurface.sln --configfile .\NuGet.config --no-cache --force

      - name: Build
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: dotnet build .\KeelMatrix.AuthSurface.sln --configuration Release --no-restore -p:Version=$env:RELEASE_VERSION -p:PackageVersion=$env:RELEASE_VERSION

      - name: Test
        run: dotnet test .\KeelMatrix.AuthSurface.sln --configuration Release --no-build --no-restore --logger 'console;verbosity=minimal'

      - name: Pack
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts/packages'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Get-ChildItem -LiteralPath $output -File -ErrorAction SilentlyContinue | Remove-Item -Force
          dotnet pack .\src\KeelMatrix.AuthSurface\KeelMatrix.AuthSurface.csproj --configuration Release --no-build --no-restore --include-symbols --p:SymbolPackageFormat=snupkg -p:Version=$env:RELEASE_VERSION -p:PackageVersion=$env:RELEASE_VERSION --output $output

      - name: Validate exact package set and contents
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts/packages'
          $expected = @(
            "KeelMatrix.AuthSurface.${env:RELEASE_VERSION}.nupkg",
            "KeelMatrix.AuthSurface.${env:RELEASE_VERSION}.snupkg"
          )
          $actual = @(Get-ChildItem -LiteralPath $output -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (@(Compare-Object -ReferenceObject $expected -DifferenceObject $actual).Count -gt 0) {
            throw "Unexpected package artifact set. Expected: $($expected -join ', '); actual: $($actual -join ', ')"
          }
          & .\scripts\inspect-package.ps1 -PackagePath (Join-Path $output $expected[0]) -SymbolPackagePath (Join-Path $output $expected[1]) -ExpectedVersion $env:RELEASE_VERSION

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e
        with:
          user: dmitriyzen

      - name: Push package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          NUGET_PUSH_TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts/packages'
          $source = 'https://api.nuget.org/v3/index.json'
          dotnet nuget push (Join-Path $output "KeelMatrix.AuthSurface.${env:RELEASE_VERSION}.nupkg") --source $source --api-key $env:NUGET_PUSH_TOKEN
          dotnet nuget push (Join-Path $output "KeelMatrix.AuthSurface.${env:RELEASE_VERSION}.snupkg") --source $source --api-key $env:NUGET_PUSH_TOKEN
