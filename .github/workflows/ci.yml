name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    env:
      KEELMATRIX_NO_TELEMETRY: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DO_NOT_TRACK: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x

      - name: Validate workflow action pins
        shell: pwsh
        timeout-minutes: 10
        run: pwsh -NoProfile -File ./scripts/validate-release-workflow.ps1

      - name: Run complete repository validation
        shell: pwsh
        timeout-minutes: 35
        run: pwsh -NoProfile -File ./scripts/validate.ps1 -Configuration Release
